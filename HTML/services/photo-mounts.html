<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Mounts - Kahoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-4 py-3">
      <a href="../../index.html" class="flex items-center">
        <img src="../../assets/logo/logowhite.jpg" alt="Kahoro Mounts & Frames Logo"
             class="h-10 w-auto sm:h-12 object-contain" />
      </a>
      <nav class="hidden md:block">
        <ul class="flex gap-6 text-sm font-medium text-gray-700">
          <li><a href="../../index.html" class="hover:text-green-600">Home</a></li>
          <li><a href="../services.html" class="hover:text-green-600">Services</a></li>
          <li><a href="../portfolio.html" class="hover:text-green-600">Portfolio</a></li>
          <li><a href="../about.html" class="hover:text-green-600">About</a></li>
          <li><a href="../contact.html" class="hover:text-green-600">Contact</a></li>
        </ul>
      </nav>
      <button id="mobile-menu-button" class="md:hidden text-gray-700 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 bg-white">
      <ul class="flex flex-col gap-4 text-sm font-medium text-gray-700">
        <li><a href="../../index.html" class="hover:text-green-600">Home</a></li>
        <li><a href="../services.html" class="hover:text-green-600">Services</a></li>
        <li><a href="../portfolio.html" class="hover:text-green-600">Portfolio</a></li>
        <li><a href="../about.html" class="hover:text-green-600">About</a></li>
        <li><a href="../contact.html" class="hover:text-green-600">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="max-w-6xl mx-auto py-10 px-4">
    <h2 class="text-3xl font-bold text-center mb-10">Photo Mounts Assorted</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6" id="photo-mount-container"></div>
  </main>

  <!-- Footer -->
  <footer id="footer-container"></footer>

  <script>
    const mounts = [
      { name: "A5 Golden Mount", image: "../../assets/mounts/A5 Gold.jpg", price: 500 },
      { name: "A5 Normal Mount", image: "../../assets/mounts/A5.jpg", price: 350 },
  
      { name: "A4 Golden Mount", image: "../../assets/mounts/A4 Gold.jpg", price: 700 },
      {
        name: "A4 Normal Mount",
        image: "../../assets/mounts/A4.jpg",
        sizes: {
          "8x12": 450,
          "10x12": 500,
          "10x14": 550
        }
      },
  
      { name: "A3 Golden Mount", image: "../../assets/mounts/A3 Gold.jpg", price: 1300 },
      {
        name: "A3 Normal Mount",
        image: "../../assets/mounts/A3.jpg",
        sizes: {
          "12x16": 850,
          "12x18": 900,
          "13x19": 950
        }
      },
  
      { name: "A2 Golden Mount", image: "../../assets/mounts/A2 Gold.jpg", price: 2500 },
      {
        name: "A2 Normal Mount",
        image: "../../assets/mounts/A2 Normal.jpg",
        sizes: {
          "16x20": 1600,
          "16x24": 1800,
          "18x24": 2000
        }
      },
  
      { name: "A1 Golden Mount", image: "../../assets/mounts/A1 Gold.jpg", price: 4200 },
      {
        name: "A1 Normal Mount",
        image: "../../assets/mounts/A1.jpg",
        sizes: {
          "20x30": 3200,
          "24x30": 3400,
          "24x36": 3500
        }
      },
  
      { name: "A0 Golden Mount", image: "../../assets/mounts/A0 Gold.jpg", price: 9000 },
      { name: "A0 Normal Mount", image: "../../assets/mounts/A0 Normal.jpg", price: 7500 }
    ];
  
    const container = document.getElementById("photo-mount-container");
  
    mounts.forEach((item, index) => {
      const uniqueId = `mount-${index}`;
      const isNormalWithSizes = item.sizes !== undefined;
      const sizeKeys = isNormalWithSizes ? Object.keys(item.sizes) : [];
      const defaultSizeIndex = sizeKeys.length > 1 ? 1 : 0;
      const defaultSize = sizeKeys[defaultSizeIndex];
      const initialPrice = isNormalWithSizes ? item.sizes[defaultSize] : item.price;
  
      let html = `
        <div class="bg-white rounded-lg shadow p-4 flex flex-col items-center text-center">
          <img src="${item.image}" alt="${item.name}" class="h-40 w-auto object-contain mb-4" />
          <h3 class="font-semibold text-lg">${item.name}</h3>
          <p class="text-green-600 font-bold" id="${uniqueId}-price">
            KES ${initialPrice}
          </p>
      `;
  
      if (isNormalWithSizes) {
        html += `
          <select id="${uniqueId}-size" class="mt-2 border p-2 rounded w-full text-sm" onchange="updatePrice('${uniqueId}', '${item.name}')">
            ${sizeKeys
              .map(
                (size, i) =>
                  `<option value="${size}" ${i === defaultSizeIndex ? "selected" : ""}>${size} - KES ${item.sizes[size]}</option>`
              )
              .join("")}
          </select>
        `;
      }
  
      html += `
        <button onclick="orderWhatsApp('${uniqueId}', '${item.name}')" 
                class="mt-3 bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded w-full">
          Order via WhatsApp
        </button>
        </div>
      `;
  
      container.innerHTML += html;
    });
  
    function updatePrice(id, name) {
      const sizeSelect = document.getElementById(`${id}-size`);
      const priceDisplay = document.getElementById(`${id}-price`);
      const selectedSize = sizeSelect.value;
      const mount = mounts.find((m) => m.name === name);
      const newPrice = mount.sizes[selectedSize];
      priceDisplay.innerText = `KES ${newPrice}`;
    }
  
    function orderWhatsApp(id, name) {
      const mount = mounts.find((m) => m.name === name);
      let price, sizeText = "", size;
  
      if (mount.sizes) {
        const sizeSelect = document.getElementById(`${id}-size`);
        size = sizeSelect.value;
        price = mount.sizes[size];
        sizeText = ` - Size: ${size}`;
      } else {
        price = mount.price;
      }
  
      const message = `I'm interested in the ${name}${sizeText}, Price: KES ${price}`;
      const link = `https://wa.me/254702578235?text=${encodeURIComponent(message)}`;
      window.open(link, "_blank");
    }

    // Load footer
    fetch("../../partials/footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer-container").innerHTML = data);
  </script>
  
  
  
</body>
</html>
